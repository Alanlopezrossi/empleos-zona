name: Actualizar ofertas

on:
  schedule:
    - cron: "17 9,13,17,21,1 * * *"   # 6:17, 10:17, 14:17, 18:17 y 22:17 hora argentina
  workflow_dispatch:                   # botón "Run workflow" para correrlo a mano
  issues:
    types: [opened]                    # avisos cargados a mano (botón / página "cargar")
  push:
    branches: [main]
    paths: ["site/**", "config.yaml", "buscador/**"]

permissions:
  contents: write   # guardar data/ofertas.json
  issues: write     # responder y cerrar los avisos cargados a mano
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    # Los issues solo cuentan si los abre el dueño del repo con la etiqueta "aviso"
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'aviso'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Agregar aviso cargado a mano
        if: github.event_name == 'issues'
        id: aviso
        env:
          AVISO_TITULO: ${{ github.event.issue.title }}
          AVISO_CUERPO: ${{ github.event.issue.body }}
          AVISO_ISSUE_URL: ${{ github.event.issue.html_url }}
          GH_TOKEN: ${{ github.token }}
          IA_KEY: ${{ secrets.IA_KEY }}
          IA_URL: ${{ vars.IA_URL }}
          IA_MODELO: ${{ vars.IA_MODELO }}
        run: |
          salida=$(python buscador/agregar_aviso.py | tee /dev/stderr | grep '^RESULTADO=' | cut -d= -f2-)
          case "$salida" in
            agregado*) msg="✅ Publicado en la página: ${salida#agregado|}" ;;
            repetido)  msg="ℹ️ Este aviso ya estaba publicado." ;;
            descartado) msg="⚠️ No parece una oferta de trabajo, no se publicó. Si es un error, cargalo de nuevo con más detalle." ;;
            *) msg="❌ No se pudo procesar el aviso." ;;
          esac
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$msg"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}

      - name: Buscar y clasificar ofertas
        if: github.event_name != 'issues'
        env:
          IA_KEY: ${{ secrets.IA_KEY }}        # opcional: clave de una IA para filtrar mejor
          IA_URL: ${{ vars.IA_URL }}
          IA_MODELO: ${{ vars.IA_MODELO }}
        run: python buscador/buscar.py

      - name: Guardar datos
        run: |
          git config user.name "empleos-bot"
          git config user.email "empleos-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Ofertas actualizadas ($GITHUB_EVENT_NAME) $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
          git pull --rebase --autostash && git push

      - name: Armar página
        run: cp data/ofertas.json site/ofertas.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
