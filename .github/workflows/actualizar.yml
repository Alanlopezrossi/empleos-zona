name: Actualizar ofertas

on:
  schedule:
    - cron: "17 9,13,17,21,1 * * *"   # 6:17, 10:17, 14:17, 18:17 y 22:17 hora argentina
  workflow_dispatch:                   # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["site/**", "config.yaml", "buscador/**"]

permissions:
  contents: write   # guardar data/ofertas.json
  models: read      # usar la IA de GitHub
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probar IA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python buscador/probar_ia.py

      - name: Buscar y clasificar ofertas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python buscador/buscar.py

      - name: Guardar datos
        run: |
          git config user.name "empleos-bot"
          git config user.email "empleos-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Ofertas actualizadas $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
          git pull --rebase --autostash && git push

      - name: Armar página
        run: cp data/ofertas.json site/ofertas.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
